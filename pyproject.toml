[project]
name = "velorum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "grpcio>=1.80.0",
    "grpcio-health-checking>=1.80.0",
    "grpcio-reflection>=1.80.0",
    "instructor>=1.15.1",
    "PyJWT>=2.4.0",
    "litellm==1.83.7",
    "pydantic==2.12.5",
    "qdrant-client>=1.16.1",
    "model2vec>=0.3.0",
    "tucana==0.0.82",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Project root on sys.path so ``import tests.local...`` and ``import src...`` resolve.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "local: model-backed tests that call a real LLM; run locally, auto-skipped in CI",
]
